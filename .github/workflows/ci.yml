name: ci
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    services:
      couchdb:
        image: couchdb:3.4
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports: ["5984:5984"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e . -r test-requirements.txt
      - run: |
          for i in $(seq 30); do curl -sf http://localhost:5984/_up && break; sleep 1; done
          curl -sf -X PUT http://admin:password@localhost:5984/_users || true
      - run: pytest -v tests
